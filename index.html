<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书籍预览 2.0 · Library</title>
<style>
  :root {
    /* 炭灰 + 单点橙（参考图），叠苹果的干净 */
    --bg: #131316;              /* 炭灰底，不闷 */
    --bg-2: #17171b;
    --panel: rgba(255, 255, 255, 0.045);
    --panel-2: rgba(255, 255, 255, 0.07);
    --stroke: rgba(255, 255, 255, 0.1);
    --stroke-soft: rgba(255, 255, 255, 0.06);
    --text: #f5f5f7;            /* Apple 文本白 */
    --text-2: #a1a1aa;
    --text-3: #6e6e76;
    --accent: #ff5a1f;          /* 唯一强调色：亮橙 */
    --accent-hover: #ff6a33;
    --accent-soft: rgba(255, 90, 31, 0.14);
    --glow: rgba(255, 90, 31, 0.28);
    --radius-m: 14px;
    --radius-l: 20px;
    --ease: cubic-bezier(.28,.11,.32,1);
    /* 去掉 saturate()、收窄模糊半径：sticky 顶栏是全宽 backdrop-blur，
       滚动时每帧都要重采样背后整条内容，是仅次于逐卡 getBoundingClientRect 的卡顿源。 */
    --blur: blur(16px);
    /* 编辑排版：衬线标题 + 无衬线正文 */
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro SC",
      "PingFang SC", "Helvetica Neue", "Microsoft YaHei", "Segoe UI", sans-serif;
    /* 腰封纸感 */
    --obi-bg: rgba(245, 241, 233, 0.96);
    --obi-text: #2b2620;
    --obi-text-2: #6e675b;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  ::selection { background: rgba(255,90,31,.35); }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #2a2a30; border-radius: 5px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a41; }

  /* 背景氛围光：极克制的暖橙，几乎不可见 */
  .aurora {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(55% 45% at 18% -5%, rgba(255,90,31,.07), transparent 62%),
      radial-gradient(45% 40% at 88% 0%, rgba(255,90,31,.045), transparent 62%);
  }
  .grain { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .5; }

  /* ---------- 顶栏 ---------- */
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(10, 10, 15, 0.65);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border-bottom: 1px solid var(--stroke-soft);
  }
  .header-inner {
    max-width: 2040px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  .search-wrap { flex: 1; min-width: 240px; max-width: 620px; position: relative; }
  .search-wrap svg {
    position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; color: var(--text-3); pointer-events: none;
  }
  #search {
    width: 100%; height: 42px; padding: 0 18px 0 41px;
    font-size: 14px; color: var(--text);
    background: var(--panel); border: 1px solid var(--stroke); border-radius: 999px;
    outline: none; transition: all .25s var(--ease);
  }
  #search::placeholder { color: var(--text-3); }
  #search:focus {
    background: var(--panel-2); border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft), 0 0 24px rgba(255,90,31,.1);
  }

  .header-actions { display: flex; align-items: center; gap: 14px; margin-left: auto; }
  #count { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .btn {
    height: 42px; padding: 0 20px; border: none; cursor: pointer;
    font-family: inherit; font-size: 13.5px; font-weight: 600;
    border-radius: 999px; transition: all .25s var(--ease); white-space: nowrap;
  }
  .btn.primary {
    background: var(--accent);
    color: #fff; box-shadow: 0 4px 16px var(--glow);
  }
  .btn.primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 6px 24px var(--glow); }
  .btn.primary:active { transform: translateY(0); }
  .btn:disabled { opacity: .55; cursor: default; transform: none; }

  /* 次要按钮：描边态 */
  .btn.ghost {
    background: var(--panel); color: var(--text-2);
    border: 1px solid var(--stroke); box-shadow: none;
  }
  .btn.ghost:hover { color: var(--text); border-color: rgba(255,255,255,.22); transform: translateY(-1px); }
  /* 全选：套用 ghost 按钮外观 + 侧栏同款勾选框 */
  .pick-all { display: inline-flex; align-items: center; gap: 9px; user-select: none; }

  /* 有后端 / 纯静态两套操作，探测到哪种模式就只留哪一套。
     默认藏静态那套：探测完成前先按本地模式显示，免得闪一下。 */
  body.static-mode .local-only,
  body:not(.static-mode) .static-only { display: none; }
  /* 没有下载源时仍能多选、导出书名；只隐藏真正会下载 PDF 的操作。 */
  body.downloads-disabled .m-download,
  body.downloads-disabled #selDownload,
  body.downloads-disabled #selCancel { display: none; }

  /* ---------- Hero ---------- */
  .hero {
    max-width: 2040px; margin: 0 auto; padding: 76px 20px 44px; text-align: center;
  }
  /* 编辑排版：编号 + 衬线大标题 + 橙色结构线 */
  .hero .kicker {
    display: flex; align-items: center; justify-content: center; gap: 16px;
    margin-bottom: 26px;
  }
  .hero .kicker .no {
    font-family: var(--serif); font-style: italic; font-size: 15px;
    color: var(--accent); letter-spacing: .05em;
  }
  .hero .kicker .rule { height: 1px; width: 72px; background: linear-gradient(90deg, transparent, var(--accent)); }
  .hero .kicker .rule.r { background: linear-gradient(90deg, var(--accent), transparent); }
  .hero .kicker .tag {
    font-size: 12.5px; font-weight: 600; letter-spacing: .3em; color: var(--text-2);
    text-transform: uppercase;
  }
  .hero h2 {
    font-family: var(--serif); font-weight: 900;
    font-size: clamp(44px, 6.5vw, 84px); letter-spacing: .02em;
    line-height: 1.04; margin: 0 0 20px;
    color: var(--text);
  }
  .hero h2 em {
    font-style: normal; color: var(--accent);
  }
  .hero .hero-rule {
    width: 120px; height: 3px; margin: 26px auto 22px;
    background: var(--accent); border-radius: 2px;
    box-shadow: 0 0 18px var(--glow);
  }
  .hero p { font-size: 16px; color: var(--text-2); margin: 0; letter-spacing: .06em; }
  .hero .stats {
    display: flex; justify-content: center; gap: 56px; margin-top: 46px; flex-wrap: wrap;
  }
  .hero .stat { position: relative; padding: 0 8px; }
  .hero .stat + .stat::before {
    content: ""; position: absolute; left: -28px; top: 12%; height: 76%;
    width: 1px; background: var(--stroke);
  }
  .hero .stat .num {
    font-family: var(--serif); font-size: 40px; font-weight: 900; letter-spacing: 0;
    color: var(--accent); font-variant-numeric: tabular-nums;
  }
  .hero .stat .lbl { font-size: 13px; color: var(--text-3); margin-top: 6px; letter-spacing: .12em; }

  /* ---------- 布局 ---------- */
  .layout {
    max-width: 2040px; margin: 0 auto; padding: 12px 20px 90px;
    display: grid; grid-template-columns: 264px 1fr; gap: 40px; align-items: start;
  }

  /* ---------- 侧栏 ---------- */
  aside {
    position: sticky; top: 88px; max-height: calc(100vh - 112px); overflow-y: auto;
    padding: 4px 26px 4px 0;
    container: sidebar / inline-size;
    /* 橙色分隔竖线：筛选区与卡片区的隔断 */
    border-right: 2px solid transparent;
    border-image: linear-gradient(180deg,
      rgba(255,90,31,0) 0%, rgba(255,90,31,.9) 10%,
      rgba(255,90,31,.9) 90%, rgba(255,90,31,0) 100%) 1;
  }
  aside::-webkit-scrollbar { width: 6px; }
  aside::-webkit-scrollbar-thumb { background: #26262f; border: none; }
  .side-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .side-head h2 {
    font-size: 14px; font-weight: 700; color: var(--text-2);
    letter-spacing: .1em; margin: 0; text-transform: uppercase;
  }
  #clearFilters {
    font-size: 14px; color: var(--accent); background: none; border: none;
    cursor: pointer; padding: 3px 8px; border-radius: 7px; font-weight: 500;
    transition: background .2s;
  }
  #clearFilters:hover { background: var(--accent-soft); }

  .filter-group { margin-top: 24px; }
  .filter-hint {
    margin: 10px 0 0; color: var(--text-3); font-size: 12px; line-height: 1.7;
  }
  .fg-title {
    font-size: 13px; font-weight: 700; color: var(--text-3);
    letter-spacing: .08em; margin-bottom: 11px; text-transform: uppercase;
    display: flex; align-items: baseline; gap: 8px;
  }
  .fg-title .fno {
    font-family: var(--serif); font-style: italic; font-weight: 400;
    color: var(--accent); font-size: 12px; letter-spacing: .04em;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips.stack { flex-direction: column; align-items: stretch; }
  .chips.stack .chip { justify-content: space-between; width: 100%; }
  /* 阅读方向是固定的二选一：同宽并列，避免按钮随“左手/右手”文字长度跳动。 */
  .chips.direction-grid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; gap: 8px;
  }
  .chips.direction-grid .chip {
    min-width: 0; justify-content: space-between; padding-inline: 11px; gap: 5px;
    white-space: nowrap;
  }
  .chips.direction-grid .lab, .chips.direction-grid .n { white-space: nowrap; }
  /* 侧栏真的窄到连两项都容不下时，切回整行；绝不把“右手书籍”拆成两行。 */
  @container sidebar (max-width: 220px) {
    .chips.direction-grid { grid-template-columns: 1fr; }
  }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 15px; font-size: 14px; font-weight: 500; cursor: pointer;
    background: var(--panel); color: var(--text-2);
    border: 1px solid var(--stroke); border-radius: 999px;
    transition: all .2s var(--ease); user-select: none; font-family: inherit;
  }
  .chip:hover { border-color: rgba(255,255,255,.22); color: var(--text); transform: translateY(-1px); }
  .chip .n { font-size: 12.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .chip.on { color: #fff; border-color: transparent; background: #1c1c21; }
  .chip.on .n { color: rgba(255,255,255,.7); }
  /* 顶层“书库类型”选中 = 实心橙；书库选中 = 深灰橙边；格式 = 深灰 */
  .chip[data-kind="coll"].on { background: var(--accent); box-shadow: 0 3px 14px var(--glow); border-color: transparent; }
  .chip[data-kind="group"].on { background: #1c1c21; border-color: var(--accent); color: #ffb49a; }
  .chip[data-kind="fmt"].on { background: #1c1c21; border-color: rgba(255,255,255,.2); }

  .cat-list { display: flex; flex-direction: column; gap: 3px; }
  .opt {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    font-size: 14.5px; cursor: pointer; border-radius: 9px; color: var(--text-2);
    transition: background .15s, color .15s; user-select: none;
  }
  .opt:hover { background: var(--panel-2); color: var(--text); }
  /* 勾选框：侧栏筛选项、卡片选择、全选共用同一套视觉 */
  .opt input, .pick input {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  .opt .box, .pick .box {
    width: 18px; height: 18px; flex-shrink: 0;
    border: 1.5px solid rgba(255,255,255,.28); border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all .18s var(--ease); background: transparent;
  }
  .opt .box::after, .pick .box::after {
    content: ""; width: 10px; height: 6px;
    border-left: 2px solid #fff; border-bottom: 2px solid #fff;
    transform: rotate(-45deg) scale(0); transition: transform .18s var(--ease);
    margin-top: -2px;
  }
  .opt input:checked + .box, .pick input:checked + .box {
    background: var(--accent);
    border-color: transparent; box-shadow: 0 0 10px var(--glow);
  }
  .opt input:focus-visible + .box, .pick input:focus-visible + .box {
    outline: 2px solid var(--accent); outline-offset: 3px;
  }
  .opt input:checked + .box::after, .pick input:checked + .box::after { transform: rotate(-45deg) scale(1); }
  .opt input:checked ~ .lab { color: var(--text); }
  /* 当前结果只选中了一部分 */
  .pick input:indeterminate + .box { background: var(--accent-soft); border-color: var(--accent); }
  .opt .lab { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opt .n { font-size: 12.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }

  details.subcat { margin-left: 28px; }
  details.subcat summary {
    font-size: 13px; color: var(--text-3); cursor: pointer; padding: 5px 10px;
    border-radius: 7px; list-style: none; user-select: none;
  }
  details.subcat summary::-webkit-details-marker { display: none; }
  details.subcat summary::before { content: "›"; display: inline-block; margin-right: 6px; transition: transform .2s var(--ease); }
  details.subcat[open] summary::before { transform: rotate(90deg); }
  details.subcat summary:hover { background: var(--panel-2); }
  details.subcat .opt { font-size: 14px; padding: 6px 10px; }

  /* ---------- 3D 书籍卡片（统一书形 · 偶数列下移的错落排列） ---------- */
  main { min-width: 0; }
  #grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    column-gap: 40px;
    row-gap: 84px;            /* 行距要大于列错位量，还要容下底部投影 */
    padding-top: 10px;
  }
  /* 错落：偶数列整体下移。用 translate 属性而不是 transform——
     translate 和 hover 的 transform 上浮互不覆盖，也不影响布局不会逐行漂移 */
  .card:nth-child(2n) { translate: 0 44px; }
  @media (min-width: 900px) {
    #grid { grid-template-columns: repeat(3, 1fr); }
    .card:nth-child(2n) { translate: none; }
    .card:nth-child(3n+2) { translate: 0 44px; }
  }
  @media (min-width: 1280px) {
    #grid { grid-template-columns: repeat(4, 1fr); }
    .card:nth-child(3n+2) { translate: none; }
    .card:nth-child(4n+2), .card:nth-child(4n+4) { translate: 0 44px; }
  }
  @media (min-width: 1680px) {
    #grid { grid-template-columns: repeat(5, 1fr); }
    .card:nth-child(4n+2), .card:nth-child(4n+4) { translate: none; }
    .card:nth-child(5n+2), .card:nth-child(5n+4) { translate: 0 44px; }
  }

  /* 卡片只是「透视舞台」：本身不画书，书在 .book 里用 preserve-3d 拼 */
  .card {
    position: relative;
    aspect-ratio: 2 / 3;        /* 所有卡片统一书形尺寸 */
    perspective: 1600px;
    container-type: inline-size; /* 书厚、字号都按卡片宽度走（cqw） */
    cursor: pointer;
    outline: none;
  }
  /* 只有视口附近的卡片才「立起来」并播入场动画（2407 张全建 3D 图层会卡死） */
  .card.inview { animation: rise .5s var(--ease) backwards; }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 4px; }

  /* 地面投影：书底下一团椭圆，用渐变的透明边做柔和，不用 blur 滤镜（滤镜每张都要重绘，卡） */
  .card .shadow {
    position: absolute; left: 3%; right: 15%; bottom: -4.5%; height: 8%;
    background: radial-gradient(52% 62% at 46% 42%,
      rgba(0,0,0,.62), rgba(0,0,0,.26) 46%, transparent 72%);
    transition: all .55s var(--ease);
    pointer-events: none;
  }

  /* 默认「平躺」：不建 3D 上下文，front 就是一张平封面，离屏卡片成本≈一张图 */
  .card .book {
    position: absolute; inset: 0;
    --t: 34px;              /* 书厚兜底值 */
    --t: 14cqw;             /* 容器查询时按卡片宽度取厚：厚书脊才有立体感 */
  }
  /* 进视口（含 600px 余量）才建立 3D：左书脊朝向读者，静止带倾斜角 */
  .card.inview .book {
    transform-style: preserve-3d;
    transform: rotateY(27deg) rotateX(1.5deg);
    transition: transform .6s var(--ease);
  }
  .card.inview:hover .book {
    transform: rotateY(9deg) rotateX(0deg) translateY(-12px);
  }
  .card.inview:hover .shadow { transform: scaleX(1.12) translateX(3%); opacity: .8; }

  .card .face { position: absolute; }
  /* 离屏时只留正面，三个侧面一律不画（不建图层、不参与合成、不重绘） */
  .card .spine, .card .pages, .card .back { display: none; }
  .card.inview .spine, .card.inview .pages, .card.inview .back { display: block; }

  /* 封面（正面） */
  .card .front {
    inset: 0;
    transform: translateZ(calc(var(--t) / 2));
    border-radius: 2px 6px 6px 2px;   /* 书脊侧几乎直角，书口侧略圆 */
    overflow: hidden;
    background: linear-gradient(160deg, #2b2b33, #17171b);  /* 无封面时的渐变底 */
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .card .front .cover-img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  /* 封面光影：书脊侧只留一道很浅很窄的折痕（黑缝太粗会像裂开的线），顶部受光 */
  .card .front::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(90deg, rgba(0,0,0,.14), transparent 5%),   /* 浅折痕，白封面也不扎眼 */
      linear-gradient(115deg, rgba(255,255,255,.10), transparent 32%);
  }

  /* 书脊（左侧，微鼓的弧面 + 竖排书名）。颜色取自封面（--cov，由 JS 取封面左缘平均色）。
     明暗分布：外侧（靠封底的铰链）最暗，脊面中间略亮做弧面，**与封面相接的一端 ≈ 封面色本身**——
     这样书脊和封面是连续的一块布，不会出现一条黑缝。
     没封面（渐变卡）时回退成统一的深灰，与 front 的渐变底相配。 */
  .card .spine {
    /* 宽出 0.6px 并相应左移：接缝处与封面微微相叠，抗锯齿也不会透出黑缝 */
    top: 0; bottom: 0; left: calc(var(--t) / -2 - 0.3px); width: calc(var(--t) + 0.6px);
    transform: rotateY(-90deg);
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--cov, #2a2a33) 45%, #000) 0%,    /* 外侧铰链：最暗 */
      var(--cov, #2a2a33) 42%,                                 /* 脊面主体 */
      color-mix(in srgb, var(--cov, #34343f) 86%, #fff) 66%,   /* 弧面受光带 */
      var(--cov, #2a2a33) 88%,                                 /* 回到基色 */
      color-mix(in srgb, var(--cov, #2a2a33) 94%, #fff) 100%); /* 接封面端 ≈ 封面色 */
    border-radius: 3px 0 0 3px;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 12% 0;
    overflow: hidden;
    box-shadow: inset -1px 0 2px rgba(255,255,255,.22);  /* 铰链处一丝高光，不是黑影 */
  }
  .card .spine .spine-title {
    writing-mode: vertical-rl;
    font-family: var(--serif); font-size: clamp(9px, 5.2cqw, 14px);
    letter-spacing: .14em; color: var(--spinetext, rgba(235,232,226,.72));
    max-height: 100%; overflow: hidden; white-space: nowrap;
    text-overflow: ellipsis;
  }
  /* 腰封绕到书脊上的那段：与正面腰封同底（11%）、同高（47cqw），
     纸色和顶部橙线连续，看着就是一整条纸带从封面包过书脊。
     skewY(5deg)：以拐角为轴错切，让上边线、下边线一起往书脊外侧（封底方向）微微上斜（外侧抬升约5px），
     拐角仍与正面腰封对齐不脱开；整本书的角度不变，只斜这一小条。 */
  .card .spine-obi {
    position: absolute; left: 0; right: 0; bottom: 11%;
    height: 47cqw;
    transform-origin: right center;
    transform: translateZ(0.5px) skewY(5deg);
    background: var(--obi-bg);
    border-top: 2px solid var(--accent);
    box-shadow: 0 2px 8px rgba(0,0,0,.28);
  }

  /* 书口（右侧页边）：米白页叠 + 细线，同样宽出 0.6px 与封面微叠防黑缝 */
  .card .pages {
    top: 1px; bottom: 1px; right: calc(var(--t) / -2 - 0.3px); width: calc(var(--t) + 0.6px);
    transform: rotateY(90deg);
    background:
      repeating-linear-gradient(90deg,
        #f2ede2 0px, #f2ede2 1.5px,
        #d7d0c0 1.5px, #d7d0c0 3px);
    border-radius: 0 2px 2px 0;
  }

  /* 背面（基本看不到，但翻转瞬间不穿帮）：跟着封面色走，比封面略深 */
  .card .back {
    inset: 0;
    transform: translateZ(calc(var(--t) / -2)) rotateY(180deg);
    background: linear-gradient(160deg,
      color-mix(in srgb, var(--cov, #1c1c22) 72%, #000),
      color-mix(in srgb, var(--cov, #121216) 52%, #000));
    border-radius: 6px 2px 2px 6px;
  }

  /* ---------- 腰封（obi）：横贯封面下部，写书名/作者/简介 ----------
     高度固定成 47cqw（不再由内容撑开），这样书脊上那段才能和它对齐成一整条。 */
  .card .obi {
    position: absolute; left: -3%; width: 106%; bottom: 11%;
    height: 47cqw;
    transform: translateZ(1px);   /* 浮在封面上 1px，避免 z-fighting */
    background: var(--obi-bg);
    padding: 3.5% 7%;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
    border-top: 2px solid var(--accent);
    display: flex; flex-direction: column; gap: 2px; justify-content: center;
    overflow: hidden;
  }
  .card .obi-title {
    font-family: var(--serif); font-weight: 700;
    font-size: clamp(12px, 5.8cqw, 17px);
    line-height: 1.28; letter-spacing: .01em; color: var(--obi-text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .obi-author {
    font-size: clamp(9px, 4.2cqw, 12px); font-weight: 600;
    color: var(--obi-text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .obi-author::before { content: "〔著〕"; color: var(--accent); font-weight: 500; margin-right: 2px; font-size: .85em; }
  .card .obi-summary {
    font-size: clamp(8.5px, 3.9cqw, 11.5px); line-height: 1.5;
    color: var(--obi-text-2); margin-top: 1px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .obi-summary.empty { font-style: italic; opacity: .7; }

  /* 选中态：封面描一圈橙 */
  .card.picked .front {
    box-shadow: inset 0 0 0 2px var(--accent), 0 0 24px var(--glow);
  }

  /* 卡片勾选框：平时隐身，hover 或已选才现身（压在书上方）。不用 backdrop-filter，省每张一次离屏混合 */
  .card .pick {
    position: absolute; top: 12px; right: 12px; z-index: 5;
    padding: 5px; cursor: pointer; opacity: 0;
    transition: opacity .2s var(--ease);
    background: rgba(12,12,16,.78); border-radius: 9px;
  }
  .card:hover .pick, .card.picked .pick { opacity: 1; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  #empty, #loading { text-align: center; color: var(--text-3); padding: 100px 0; font-size: 15px; }
  #empty { display: none; }
  #empty .big { font-size: 44px; margin-bottom: 14px; opacity: .6; }
  #emptyReset { margin-top: 22px; }

  /* ---------- 书籍详情弹窗（书随详情：左书右文） ---------- */
  .modal-mask {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(8, 8, 12, 0.6);

  .modal {

  .modal-mask.show .modal { transform: translateY(0) scale(1); }
  .modal::-webkit-scrollbar { width: 8px; }
  .modal::-webkit-scrollbar-thumb { background: #2a2a30; border-radius: 4px; }

  /* 封面氛围：封面图放大糊化垫在内容底下，深色渐变压一层保可读性 */
  .modal .m-ambient {
    position: absolute; inset: -60px; z-index: 0; pointer-events: none;

  .modal .m-scrim {

  /* 左侧舞台：和卡片同一本 3D 书（去掉腰封露出完整封面），hover 会像卡片一样转正 */
  .modal .m-stage { position: relative; aspect-ratio: 2/3; perspective: 1400px; }
  .modal .m-stage .m-ground {

  .modal .m-book {

  }
  .modal .m-stage:hover .m-book { transform: rotateY(10deg) rotateX(0deg) translateY(-8px); }
  .modal.enter .m-book { animation: mBookIn .62s var(--ease) .1s backwards; }
  @keyframes mBookIn {
    from { opacity: 0; transform: rotateY(52deg) rotateX(3deg) translateY(30px); }
    to   { opacity: 1; transform: rotateY(24deg) rotateX(1.5deg) translateY(0); }
  }
  .modal .m-face { position: absolute; }
  .modal .m-front {
    inset: 0; transform: translateZ(calc(var(--t) / 2));
    border-radius: 2px 6px 6px 2px; overflow: hidden;
    background: linear-gradient(160deg, #2b2b33, #17171b);  /* 无封面时的渐变底 */

  .modal .m-front img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .modal .m-front::after {

  }
  .modal .m-spine {
    top: 0; bottom: 0; left: calc(var(--t) / -2 - 0.3px); width: calc(var(--t) + 0.6px);
    transform: rotateY(-90deg);
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--cov, #2a2a33) 45%, #000) 0%,
      var(--cov, #2a2a33) 42%,
      color-mix(in srgb, var(--cov, #34343f) 86%, #fff) 66%,
      var(--cov, #2a2a33) 88%,
      color-mix(in srgb, var(--cov, #2a2a33) 94%, #fff) 100%);
    border-radius: 3px 0 0 3px;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 12% 0; overflow: hidden;
    box-shadow: inset -1px 0 2px rgba(255,255,255,.22);
  }
  .modal .m-spine .spine-title {
    writing-mode: vertical-rl; font-family: var(--serif); font-size: 13px;
    letter-spacing: .14em; color: var(--spinetext, rgba(235,232,226,.72));
    max-height: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .modal .m-pages {
    top: 1px; bottom: 1px; right: calc(var(--t) / -2 - 0.3px); width: calc(var(--t) + 0.6px);
    transform: rotateY(90deg);
    background: repeating-linear-gradient(90deg, #f2ede2 0px, #f2ede2 1.5px, #d7d0c0 1.5px, #d7d0c0 3px);
    border-radius: 0 2px 2px 0;
  }
  .modal .m-back {
    inset: 0; transform: translateZ(calc(var(--t) / -2)) rotateY(180deg);
    background: linear-gradient(160deg,
      color-mix(in srgb, var(--cov, #1c1c22) 72%, #000),
      color-mix(in srgb, var(--cov, #121216) 52%, #000));

  }

  /* 右侧文字：排版沿用原弹窗，只加逐项升起的入场 */
  .modal.enter .m-text > * { animation: mTextIn .5s var(--ease) backwards; }
  .modal.enter .m-text > *:nth-child(1) { animation-delay: .16s; }
  .modal.enter .m-text > *:nth-child(2) { animation-delay: .22s; }
  .modal.enter .m-text > *:nth-child(3) { animation-delay: .28s; }
  .modal.enter .m-text > *:nth-child(4) { animation-delay: .34s; }
  .modal.enter .m-text > *:nth-child(5) { animation-delay: .40s; }
  .modal.enter .m-text > *:nth-child(6) { animation-delay: .46s; }
  .modal.enter .m-text > *:nth-child(7) { animation-delay: .52s; }
  .modal.enter .m-text > *:nth-child(8) { animation-delay: .58s; }
  @keyframes mTextIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  @media (max-width: 760px) {

  .modal .m-idx {

  }
  .modal .m-idx::after { content: ""; height: 1px; flex: 1; background: linear-gradient(90deg, var(--accent), transparent); opacity: .5; }
  .modal .m-title {

  .modal .m-sec {

  .modal .m-crumbs { display: flex; flex-wrap: wrap; gap: 7px; }

  .modal .m-download {
    height: 44px; padding: 0 24px; border: none; cursor: pointer; border-radius: 999px;
    font-family: inherit; font-size: 14px; font-weight: 600;
    background: var(--accent); color: #fff; box-shadow: 0 4px 16px var(--glow);
    transition: all .25s var(--ease); display: inline-flex; align-items: center; gap: 8px;
  }
  .modal .m-download:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 6px 24px var(--glow); }
  .modal .m-download:disabled { opacity: .55; cursor: default; transform: none; }
  .modal .m-path {
    font-size: 12px; color: var(--text-3); word-break: break-all; flex: 1;
    font-family: ui-monospace, monospace; line-height: 1.5;
  }
  .m-download-status { display: none; color: var(--text-2); font-size: 13px; }
  body.downloads-disabled .m-download-status { display: block; }

  .tag {   /* 基础标签样式：hero、弹窗在用 */
    font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 999px;

  }
  .tag.coll {

  /* ---------- 批量选择浮条：选中 1 本才滑出 ---------- */
  .sel-bar {
    position: fixed; left: 50%; bottom: 26px; z-index: 60;

  #toTop {

  @media (max-width: 940px) {
    .layout { grid-template-columns: 1fr; gap: 24px; }

    .hero { padding: 48px 24px 32px; }

<script>
let allBooks = [];
let filtersData = { collections: {}, formats: [] };

// 纯静态部署（Cloudflare Pages）没有 /api，启动时探一次就定下走哪条路。
// 同一份页面因此本地和线上都能跑，不用维护两份。
let staticMode = false;
let siteConfig = { downloadBase: "" };

// 挂载点自适应：页面在 /v2/ 下时，封面与静态 JSON 都在上一级，走 ../ 前缀；
// 部署到站点根目录时它们就在同目录，前缀为空。filter_state.js 两个挂载点都放了一份同目录副本。
const ASSET_PREFIX = location.pathname.includes("/v2/") ? "../" : "";

const sel = {
  collections: new Set(), groups: new Set(), categories: new Set(),
  subcategories: new Set(), formats: new Set(), keyword: "",
};

// 批量下载：已勾选书籍的 path。跨筛选保留，筛掉的也不丢。
const picked = new Set();
let shownBooks = [];

const $ = (s) => document.querySelector(s);
const grid = $("#grid"), emptyEl = $("#empty"), loadingEl = $("#loading");

// 性能关键：只有视口附近（上下各留 600px 余量）的卡片才打 .inview 标——
// 打了标的才建立 3D 图层、画书脊/书口；离屏卡片只是平躺的一张平封面，
// 不合成、不重绘。2407 张全建 3D 会卡死，视口附近这几十张则毫无压力。
// 这里不用 IntersectionObserver：本项目曾实测，在某些不合成帧的环境里 IO 根本不回调，
// 卡片会永远起不来。改用「缓存文档坐标」：渲染/缩放时量一次每张卡的位置，
// 滚动时只拿 scrollY 跟缓存值比，不再逐卡 getBoundingClientRect() 强制全页重排，
// 这样既可靠，又去掉了原来每次滚动都触发的 2407 次同步 reflow——那才是滑动卡顿的元凶。
const ARM_MARGIN = 600;
let cardRects = [];          // 与 grid.children 同序，存文档坐标 {top, bottom}

function cacheCardRects() {
  const cards = grid.children;
  cardRects = new Array(cards.length);
  const base = window.scrollY;
  for (let i = 0; i < cards.length; i++) {
    const r = cards[i].getBoundingClientRect();
    cardRects[i] = { top: r.top + base, bottom: r.bottom + base };
  }
}

function armVisible() {
  const viewTop = window.scrollY - ARM_MARGIN;
  const viewBottom = window.scrollY + window.innerHeight + ARM_MARGIN;
  const cards = grid.children;
  for (let i = 0; i < cards.length; i++) {
    const r = cardRects[i];
    cards[i].classList.toggle("inview", r.bottom > viewTop && r.top < viewBottom);
  }
}
let armTimer = null;
function scheduleArm() {                     // 节流：80ms 最多重算一遍，滚动时不会反复触发
  if (armTimer) return;
  armTimer = setTimeout(() => { armTimer = null; armVisible(); }, 80);
}
window.addEventListener("scroll", scheduleArm, { passive: true });

let armResizeTimer = null;
window.addEventListener("resize", () => {    // 尺寸变了坐标全废，重量一遍；拖动缩放太频繁，也节流
  if (armResizeTimer) return;
  armResizeTimer = setTimeout(() => {
    armResizeTimer = null;
    cacheCardRects();
    armVisible();
  }, 80);
}, { passive: true });

// 404 和「返回的不是 JSON」都要算失败：有些静态托管会拿 HTML 兜底未知路径
function getJSON(url) {
  return fetch(url).then(r => {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  });
}

async function loadAll() {
  loadingEl.style.display = "block";
  let booksRes, filtersRes;
  try {
    [booksRes, filtersRes] = await Promise.all([
      getJSON("/api/books"), getJSON("/api/filters"),
    ]);
  } catch {
    staticMode = true;
    document.body.classList.add("static-mode");
    [booksRes, filtersRes, siteConfig] = await Promise.all([
      getJSON(ASSET_PREFIX + "books.json"), getJSON(ASSET_PREFIX + "filters.json"),
      getJSON(ASSET_PREFIX + "config.json").catch(() => siteConfig),   // 配置丢了也别把整站拖垮
    ]);
  }
  allBooks = booksRes.books;
  filtersData = filtersRes;
  // 重新扫描后书可能没了，别让选中集合留着死路径
  const alive = new Set(allBooks.map(b => b.path));
  for (const p of [...picked]) if (!alive.has(p)) picked.delete(p);
  loadingEl.style.display = "none";
  syncDownloadAvailability();
  renderStats();
  renderFilters();
  applyFilters();
}

function renderStats() {
  const colls = Object.keys(filtersData.collections);
  animateNum($("#statTotal"), allBooks.length);
  animateNum($("#statLeft"), countOf(b => b.collection === colls[0]));
  animateNum($("#statRight"), countOf(b => b.collection === colls[1]));
  $("#statLeftLbl").textContent = colls[0] || "—";
  $("#statRightLbl").textContent = colls[1] || "—";
}
function animateNum(el, target) {
  if (!el) return;
  const t0 = performance.now(), dur = 900;
  (function tick(t) {
    const p = Math.min((t - t0) / dur, 1);
    el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}

// 键统一带 collection 前缀，避免不同集合下同名分类串扰。
const gk = BookFilterState.groupKey;
const ck = BookFilterState.categoryKey;
const sk = BookFilterState.subcategoryKey;

function appendFilterHint(box, text) {
  const hint = document.createElement("p");
  hint.className = "filter-hint";
  hint.textContent = text;
  box.appendChild(hint);
}

function renderFilters() {
  const box = $("#filters");
  box.innerHTML = "";
  const colls = Object.keys(filtersData.collections);

  // 第一级：默认“全部”，也可缩小到某个书库。
  const tWrap = document.createElement("div");
  tWrap.className = "filter-group";
  tWrap.innerHTML = '<div class="fg-title"><span class="fno">01</span>书库类型</div>';
  const tChips = document.createElement("div");
  tChips.className = "chips stack";
  tChips.appendChild(makeChip("全部", allBooks.length, !sel.collections.size, () => {
    BookFilterState.selectAll(sel);
    renderFilters(); applyFilters();
  }, "all", "all"));
  for (const coll of colls) {
    const n = countOf(b => b.collection === coll);
    tChips.appendChild(makeChip(coll, n, sel.collections.has(coll), () => {
      BookFilterState.selectCollection(sel, coll);
      renderFilters(); applyFilters();
    }, coll, "coll"));
  }
  tWrap.appendChild(tChips);
  box.appendChild(tWrap);

  const selectedCollection = sel.collections.size === 1 ? [...sel.collections][0] : null;

  // 第二级始终显示；选中一级时只统计该书库，否则统计全部书库。
  const gWrap = document.createElement("div");
  gWrap.className = "filter-group";
  gWrap.innerHTML = '<div class="fg-title"><span class="fno">02</span>阅读方向</div>';
  const gChips = document.createElement("div");
  gChips.className = "chips direction-grid";
  const scopeBooks = allBooks.filter(b => !selectedCollection || b.collection === selectedCollection);
  const groupNames = [...new Set(scopeBooks.map(b => b.group).filter(Boolean))];
  for (const group of groupNames) {
    const groupKeys = [...new Set(scopeBooks.filter(b => b.group === group).map(b => gk(b.collection, b.group)))];
    const on = groupKeys.length > 0 && groupKeys.every(key => sel.groups.has(key)) && sel.groups.size === groupKeys.length;
    gChips.appendChild(makeChip(group, scopeBooks.filter(b => b.group === group).length, on, () => {
        BookFilterState.selectGroups(sel, groupKeys);
        renderFilters(); applyFilters();
      }, group, "group"));
  }
  if (!groupNames.length) appendFilterHint(gWrap, "该书库暂无阅读方向。");
  gWrap.appendChild(gChips);
  box.appendChild(gWrap);

  // 第三级标题始终显示；具体分类按当前左右手切换。
  const cWrap = document.createElement("div");
  cWrap.className = "filter-group";
  const selectedGroupNames = [...new Set([...sel.groups].map(key => key.split("|")[1]).filter(Boolean))];
  const selectedGroup = selectedGroupNames.length === 1 ? selectedGroupNames[0] : null;
  cWrap.innerHTML = `<div class="fg-title"><span class="fno">03</span>${selectedGroup ? esc(selectedGroup) + "分类" : "具体分类"}</div>`;
  if (!selectedGroup) {
    appendFilterHint(cWrap, scopeBooks.length
      ? "请选择左手书籍或右手书籍，具体分类会随之切换。"
      : "该书库暂无具体分类。");
    box.appendChild(cWrap);
    return;
  }
  const catList = document.createElement("div");
  catList.className = "cat-list";
  const groupBooks = scopeBooks.filter(b => b.group === selectedGroup);
  const categoryNames = [...new Set(groupBooks.map(b => b.category).filter(Boolean))];
  for (const cat of categoryNames) {
    const categoryBooks = groupBooks.filter(b => b.category === cat);
    const categoryKeys = [...new Set(categoryBooks.map(b => ck(b.collection, b.group, b.category)))];
    catList.appendChild(makeOpt(cat, categoryKeys.length > 0 && categoryKeys.every(key => sel.categories.has(key)), (on) => {
      for (const key of categoryKeys) on ? sel.categories.add(key) : sel.categories.delete(key);
      applyFilters();
    }, categoryBooks.length));
    const subs = [...new Set(categoryBooks.map(b => b.subcategory).filter(Boolean))];
    if (subs.length) {
      const det = document.createElement("details");
      det.className = "subcat";
      const sum = document.createElement("summary");
      sum.textContent = "子分类 · " + subs.length;
      det.appendChild(sum);
      for (const sub of subs) {
        const subBooks = categoryBooks.filter(b => b.subcategory === sub);
        const subKeys = [...new Set(subBooks.map(b => sk(b.collection, b.group, b.category, b.subcategory || "")))];
        det.appendChild(makeOpt(sub, subKeys.length > 0 && subKeys.every(key => sel.subcategories.has(key)), (on) => {
          for (const key of subKeys) on ? sel.subcategories.add(key) : sel.subcategories.delete(key);
          applyFilters();
        }, subBooks.length));
      }
      catList.appendChild(det);
    }
  }
  cWrap.appendChild(catList);
  box.appendChild(cWrap);
}

function makeChip(label, count, on, onChange, group, kind) {
  const el = document.createElement("button");
  el.className = "chip" + (on ? " on" : "");
  if (group) el.dataset.group = group;
  if (kind) el.dataset.kind = kind;
  el.setAttribute("aria-pressed", on ? "true" : "false");
  el.innerHTML = `<span class="lab">${esc(label)}</span><span class="n">${count}</span>`;
  el.addEventListener("click", () => onChange(!on));
  return el;
}

function makeOpt(label, checked, onChange, count) {
  const lab = document.createElement("label");
  lab.className = "opt";
  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.checked = checked;
  cb.addEventListener("change", () => onChange(cb.checked));
  const box = document.createElement("span"); box.className = "box";
  const txt = document.createElement("span"); txt.className = "lab"; txt.textContent = label;
  lab.appendChild(cb); lab.appendChild(box); lab.appendChild(txt);
  if (typeof count === "number") {
    const n = document.createElement("span"); n.className = "n"; n.textContent = count;
    lab.appendChild(n);
  }
  return lab;
}

function countOf(fn) { return allBooks.reduce((a, b) => a + (fn(b) ? 1 : 0), 0); }

function applyFilters() {
  const kws = sel.keyword.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const out = BookFilterState.isReady(sel) ? allBooks.filter(b => {
    if (kws.length) {
      const hay = ((b.title || "") + " " + (b.author || "")).toLowerCase();
      if (!kws.every(k => hay.includes(k))) return false;
    }
    return BookFilterState.matches(sel, b);
  }) : [];

  // 空态文案：若所选集合本身为空（如“拓展好评书籍”尚无书），提示“待添加”
  const emptyText = $("#emptyText");
  const emptyReset = $("#emptyReset");
  const selectedEmptyColl = [...sel.collections].some(c => countOf(b => b.collection === c) === 0);
  const emptyCollectionState = out.length === 0 && selectedEmptyColl
    && !sel.categories.size && !sel.subcategories.size;
  emptyReset.hidden = !emptyCollectionState;
  if (emptyCollectionState) {
    emptyText.textContent = "该书库暂时还没有入库书籍";
  } else if (sel.collections.size && !sel.groups.size) {
    emptyText.textContent = "请再选择左手书籍或右手书籍";
  } else {
    emptyText.textContent = "没有找到匹配的书籍";
  }

  shownBooks = out;
  renderCards(out);
  updateSelUI();
  $("#count").textContent = `${out.length} / ${allBooks.length}`;
}

function renderCards(list) {
  grid.innerHTML = "";
  if (!list.length) { emptyEl.style.display = "block"; return; }
  emptyEl.style.display = "none";
  const frag = document.createDocumentFragment();
  list.forEach((b, i) => {
    const card = document.createElement("div");
    const on = picked.has(b.path);
    card.className = "card " + (b.cover ? "has-cover" : "no-cover") + (on ? " picked" : "");
    card.dataset.path = b.path;
    card.setAttribute("role", "button");
    card.setAttribute("aria-label", `查看《${b.title || "未命名"}》详情`);
    card.tabIndex = 0;
    card.style.animationDelay = Math.min(i, 24) * 20 + "ms";
    const idx = "A" + (i + 1);
    // 封面在上一级目录（covers/xx.jpg），统一加 ASSET_PREFIX；
    // alt 留空：书名就在腰封上，封面属于装饰，别让读屏器念两遍
    const coverHtml = b.cover
      ? `<img class="cover-img" loading="lazy" decoding="async" src="${ASSET_PREFIX}${encodeURI(b.cover)}" alt="">`
      : "";
    // 3D 书：背面 + 书脊（竖排书名）+ 书口 + 封面（封面上压着腰封）
    card.innerHTML = `
      <span class="shadow"></span>
      <div class="book">
        <div class="face back"></div>
        <div class="face spine"><span class="spine-title">${esc(b.title || "未命名")}</span><div class="spine-obi"></div></div>
        <div class="face pages"></div>
        <div class="face front">
          ${coverHtml}
          <div class="obi">
            <div class="obi-title" title="${esc(b.title)}">${esc(b.title)}</div>
            <div class="obi-author" title="${esc(b.author || "")}">${esc(b.author || "佚名")}</div>
            <div class="obi-summary ${b.summary ? "" : "empty"}">${b.summary ? esc(b.summary) : "暂无简介"}</div>
          </div>
        </div>
      </div>
      <label class="pick" title="选择这本书"><input type="checkbox" aria-label="选择《${esc(b.title || "未命名")}》"${on ? " checked" : ""}><span class="box"></span></label>`;
    // 封面加载失败（文件被删/还没生成）：摘掉图，front 回退成渐变底，腰封仍在
    const coverImg = card.querySelector(".cover-img");
    if (coverImg) {
      // 封面就绪后取色，给书脊/封底染色（已缓存的直接取，否则等 load）
      if (coverImg.complete && coverImg.naturalWidth) tintBookFromCover(card, coverImg);
      else coverImg.addEventListener("load", () => tintBookFromCover(card, coverImg), { once: true });
      coverImg.addEventListener("error", () => {
        coverImg.remove();
        card.classList.remove("has-cover");
        card.classList.add("no-cover");
      });
    }
    card.addEventListener("click", () => openModal(b, idx));
    card.addEventListener("keydown", (e) => {
      if (e.target !== card || !(e.key === "Enter" || e.key === " ")) return;
      e.preventDefault();
      openModal(b, idx);
    });
    const pick = card.querySelector(".pick");
    pick.addEventListener("click", (e) => e.stopPropagation());   // 勾选不弹窗
    pick.querySelector("input").addEventListener("change", (e) => {
      e.target.checked ? picked.add(b.path) : picked.delete(b.path);
      card.classList.toggle("picked", e.target.checked);
      updateSelUI();
    });
    frag.appendChild(card);
  });
  grid.appendChild(frag);
  cacheCardRects();     // 量一次每张卡的文档坐标，之后滚动只比对缓存，不重排
  armVisible();         // 立即标记当前视口内的卡片为 3D，其余保持平躺
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* 从封面提取书脊色：取封面靠左一条（与书脊相接的那侧）的平均色，
   书脊/封底跟着封面走，看起来才是一本真书，而不是统一的灰壳。
   同源图片，canvas 不会被污染，放心读像素。 */
function coverSpineColor(img) {
  try {
    const w = 8, h = 8;
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    const cx = cv.getContext("2d", { willReadFrequently: true });
    const sw = Math.max(1, Math.floor(img.naturalWidth * 0.18));  // 左缘 18% 一条
    cx.drawImage(img, 0, 0, sw, img.naturalHeight, 0, 0, w, h);
    const d = cx.getImageData(0, 0, w, h).data;
    let r = 0, g = 0, b = 0;
    const n = w * h;
    for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
    return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
  } catch { return null; }
}

// 把取到的颜色写到卡片 CSS 变量上；书脊浅色时用深字、深色时用浅字
function tintBookFromCover(card, img) {
  const c = coverSpineColor(img);
  if (!c) return;
  const [r, g, b] = c;
  card.style.setProperty("--cov", `rgb(${r},${g},${b})`);
  const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  card.style.setProperty("--spinetext",
    lum > 150 ? "rgba(32,28,24,.8)" : "rgba(238,235,230,.82)");
}

/* ---------- 批量选择与下载 ---------- */
function fmtSize(bytes) {
  const mb = bytes / 1048576;
  return mb >= 1024 ? (mb / 1024).toFixed(2) + " GB" : mb.toFixed(1) + " MB";
}

function updateSelUI() {
  const n = picked.size;
  $("#selCount").textContent = n;
  const namesOnly = staticMode && !siteConfig.downloadBase;
  $("#selMeta").hidden = namesOnly;
  $("#selSize").textContent = fmtSize(
    allBooks.reduce((a, b) => a + (picked.has(b.path) ? (b.size || 0) : 0), 0));
  $("#selBar").classList.toggle("show", n > 0);
  // 全选态只看当前筛选结果：全中才算勾上，选了一部分显示半选
  const hit = shownBooks.reduce((a, b) => a + (picked.has(b.path) ? 1 : 0), 0);
  const box = $("#pickAll");
  box.checked = shownBooks.length > 0 && hit === shownBooks.length;
  box.indeterminate = hit > 0 && hit < shownBooks.length;
}

// 只改已渲染卡片的勾选态，不整片重渲染，免得入场动画重放
function syncCardMarks() {
  grid.querySelectorAll(".card").forEach(card => {
    const on = picked.has(card.dataset.path);
    card.classList.toggle("picked", on);
    card.querySelector(".pick input").checked = on;
  });
  updateSelUI();
}

// 库内相对路径 -> 下载地址。静态模式拼 downloadBase：分隔符统一成 /，
// 再逐段编码，书名里的 + 才不会在 URL 里被当成空格。
function bookURL(path) {
  if (!staticMode) return "/api/download?path=" + encodeURIComponent(path);
  const segs = String(path).split(/[\\/]/).filter(Boolean).map(encodeURIComponent);
  return (siteConfig.downloadBase || "").replace(/\/+$/, "") + "/" + segs.join("/");
}

function syncDownloadAvailability() {
  const disabled = staticMode && !siteConfig.downloadBase;
  document.body.classList.toggle("downloads-disabled", disabled);
  const exportBtn = $("#selExport");
  exportBtn.textContent = disabled ? "导出书名清单" : "导出清单";
  exportBtn.title = disabled ? "导出已选书籍的书名（TXT）" : "导出直链清单，喂给 IDM / aria2 / 迅雷";
}

function downloadReady() {
  return !(staticMode && !siteConfig.downloadBase);
}

function saveAs(href, name) {
  const a = document.createElement("a");
  a.href = href;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function triggerDownload(path) {
  saveAs(bookURL(path), "");    // 文件名交给服务端的 Content-Disposition
}

// 今天的日期，YYYY-MM-DD（sv 区域就是这个格式）
const today = () => new Date().toLocaleDateString("sv");

$("#pickAll").addEventListener("change", (e) => {
  for (const b of shownBooks) e.target.checked ? picked.add(b.path) : picked.delete(b.path);
  syncCardMarks();
});
$("#selInvert").addEventListener("click", () => {
  for (const b of shownBooks) picked.has(b.path) ? picked.delete(b.path) : picked.add(b.path);
  syncCardMarks();
});
$("#selClear").addEventListener("click", () => { picked.clear(); syncCardMarks(); });

const BATCH_GAP_MS = 400;       // 每本之间的间隔：连发太快浏览器会把后面的直接吞掉
const BATCH_CONFIRM_AT = 10;    // 超过这个数先问一声，顺便提醒浏览器的多文件拦截
let batchAbort = false;

// 静态模式没有服务端打包，只能一本本触发。返回收尾时按钮该显示的字。
async function downloadOneByOne(paths, btn) {
  if (paths.length > BATCH_CONFIRM_AT && !confirm(
      `要依次下载 ${paths.length} 本书。\n浏览器可能会问你「是否允许下载多个文件」，点允许即可。\n` +
      `本数多的话更推荐「导出清单」，拿去喂 IDM / aria2 / 迅雷。\n\n继续？`))
    return "下载选中 ↓";
  batchAbort = false;
  $("#selCancel").hidden = false;
  try {
    for (let i = 0; i < paths.length; i++) {
      if (batchAbort) return `已取消 ${i} / ${paths.length}`;
      btn.textContent = `下载中 ${i + 1} / ${paths.length}`;
      triggerDownload(paths[i]);
      await new Promise(r => setTimeout(r, BATCH_GAP_MS));
    }
  } finally {
    $("#selCancel").hidden = true;
  }
  return "已开始下载 ✓";
}

$("#selCancel").addEventListener("click", () => { batchAbort = true; });

$("#selDownload").addEventListener("click", async () => {
  const paths = [...picked];
  if (!paths.length || !downloadReady()) return;
  const btn = $("#selDownload");
  btn.disabled = true;
  try {
    if (paths.length === 1) {
      triggerDownload(paths[0]);        // 只有一本就别打包了，直接下
      btn.textContent = "已开始下载 ✓";
    } else if (staticMode) {
      btn.textContent = await downloadOneByOne(paths, btn);
    } else {
      btn.textContent = "打包中…";
      const r = await fetch("/api/download-zip", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ paths }),
      });
      if (!r.ok) throw new Error(r.status);
      const url = URL.createObjectURL(await r.blob());
      saveAs(url, "书籍_" + today() + ".zip");
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      btn.textContent = "已开始下载 ✓";
    }
  } catch {
    btn.textContent = "打包失败，再点一次";
  }
  setTimeout(() => { btn.disabled = false; btn.textContent = "下载选中 ↓"; }, 2000);
});

// 静态站点没配下载源时导出书名；配了下载源时仍可导出直链给下载器。
$("#selExport").addEventListener("click", () => {
  if (!picked.size) return;
  const selectedBooks = allBooks.filter(b => picked.has(b.path));
  const namesOnly = staticMode && !siteConfig.downloadBase;
  const lines = namesOnly
    ? selectedBooks.map(b => b.title || "未命名")
    : selectedBooks.map(b => bookURL(b.path));
  const url = URL.createObjectURL(
    new Blob([lines.join("\r\n") + "\r\n"], { type: "text/plain;charset=utf-8" }));
  saveAs(url, namesOnly ? "书名清单_" + today() + ".txt" : "下载清单_" + today() + ".txt");
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  const btn = $("#selExport");
  btn.textContent = `已导出 ${lines.length} 条 ✓`;
  setTimeout(() => { btn.textContent = namesOnly ? "导出书名清单" : "导出清单"; }, 2000);
});

/* ---------- 书籍详情弹窗 ---------- */
const modalMask = $("#modalMask");
let modalBook = null;
let modalReturnFocus = null;

function openModal(b, idx) {
  modalReturnFocus = document.activeElement;
  modalBook = b;
  $("#mIdx").textContent = idx || "";
  $("#mTitle").textContent = b.title || "未命名";
  $("#mAuthor").textContent = b.author || "佚名";

  const sumEl = $("#mSummary");
  if (b.summary) {
    sumEl.textContent = b.summary;
    sumEl.classList.remove("empty");
  } else {
    sumEl.textContent = "这本书还没有生成梗概。";
    sumEl.classList.add("empty");
  }

  const crumbEls = [b.collection, b.group, b.category, b.subcategory].filter(Boolean);
  $("#mCrumbs").innerHTML =
    crumbEls.map(c => `<span class="tag">${esc(c)}</span>`).join("") +
    `<span class="tag fmt">${esc(b.format)}</span>`;

  $("#mPath").textContent = `${String(b.format || "PDF").toUpperCase()} · ${fmtSize(b.size || 0)}`;

  // 详情里的这本书：封面、书脊取色、氛围光都从卡片延续过来。
  // 每次打开先清掉上一本的取色，免得无封面书沾上上一本的书脊色。
  const mBook = $("#mBook");
  mBook.style.removeProperty("--cov");
  mBook.style.removeProperty("--spinetext");
  $("#mSpineTitle").textContent = b.title || "未命名";
  const mCover = $("#mCover");
  mCover.style.display = b.cover ? "" : "none";
  $("#mAmbient").style.backgroundImage = b.cover ? `url("${ASSET_PREFIX}${encodeURI(b.cover)}")` : "none";
  if (b.cover) {
    const src = ASSET_PREFIX + encodeURI(b.cover);
    mCover.onerror = () => { mCover.style.display = "none"; };
    if (mCover.getAttribute("src") !== src) mCover.src = src;
    if (mCover.complete && mCover.naturalWidth) tintBookFromCover(mBook, mCover);
    else mCover.addEventListener("load", () => tintBookFromCover(mBook, mCover), { once: true });
  }
  // 重触发入场动画：书立起 + 文字逐项升起
  const modalEl = modalMask.querySelector(".modal");
  modalEl.classList.remove("enter");
  void modalEl.offsetWidth;
  modalEl.classList.add("enter");

  modalMask.classList.add("show");
  document.body.style.overflow = "hidden";
  $("#modalClose").focus();
}

function closeModal() {
  modalMask.classList.remove("show");
  document.body.style.overflow = "";
  modalBook = null;
  if (modalReturnFocus && typeof modalReturnFocus.focus === "function") modalReturnFocus.focus();
  modalReturnFocus = null;
}

$("#modalClose").addEventListener("click", closeModal);
modalMask.addEventListener("click", (e) => { if (e.target === modalMask) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && modalMask.classList.contains("show")) closeModal(); });

$("#mDownload").addEventListener("click", () => {
  if (!modalBook || !downloadReady()) return;
  const btn = $("#mDownload");
  triggerDownload(modalBook.path);
  btn.textContent = "已开始下载 ✓";
  setTimeout(() => { btn.textContent = "下载书籍 ↓"; }, 1500);
});

let debounceTimer = null;
$("#search").addEventListener("input", (e) => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => { sel.keyword = e.target.value; applyFilters(); }, 150);
});
$("#clearFilters").addEventListener("click", () => {
  sel.collections.clear(); sel.groups.clear(); sel.categories.clear();
  sel.subcategories.clear(); sel.formats.clear();
  $("#search").value = ""; sel.keyword = "";
  renderFilters(); applyFilters();
});
$("#emptyReset").addEventListener("click", () => {
  BookFilterState.selectAll(sel);
  $("#search").value = ""; sel.keyword = "";
  renderFilters(); applyFilters();
});
$("#refreshBtn").addEventListener("click", async () => {
  const btn = $("#refreshBtn");
  btn.disabled = true; btn.textContent = "扫描中…";
  try {
    await fetch("/api/refresh", { method: "POST" });
    await loadAll();
  } finally {
    btn.disabled = false; btn.textContent = "重新扫描";
  }
});

const toTop = $("#toTop");
window.addEventListener("scroll", () => {
  toTop.classList.toggle("show", window.scrollY > 600);
}, { passive: true });
toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

loadAll();
</script>
